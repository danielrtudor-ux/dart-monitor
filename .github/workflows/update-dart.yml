name: Update DART feed and valuations

on:
  schedule:
    # 22:30 UTC = 07:30 Korea time (KST)
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    paths:
      - "valuation.py"
      - "accounting.py"
      - "postprocess_valuation.py"
      - "tests/**"
      - "valuation_config.json"
      - "audit_valuation.py"
      - "valuation_adjustments.py"
      - "note_review_facts.json"
      - "fx_reference.json"
      - ".github/workflows/update-dart.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test accounting and valuation rules
        run: python -m unittest discover -s tests -v

      - name: Run OpenDART collector
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python monitor.py

      - name: Run valuation engine
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python valuation.py

      - name: Audit valuation output
        run: python audit_valuation.py

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dart-latest.json docs/valuation-latest.json docs/valuation-audit.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update DART feed and valuations"
            git push
          fi
